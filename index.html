gan natija. I am going to buy a new phone.`,x:[[`I am going to open a shop.`,`Men do'kon ochmoqchiman.`],[`It is going to rain.`,`Yomg'ir yog'adi (belgilar bor).`]],q:[[`She ___ going to call him.`,[`am`,`is`,`are`],1],[`They are going ___ travel.`,[`to`,`for`,`at`],0]]},37:{e:`will + fe'l: shu zahoti qilingan qaror, va'da, bashorat. Qisqartma: I'll. Inkor: won't. Oldindan rejalangan ish uchun going to ishlatiladi.`,x:[[`I will help you.`,`Men sizga yordam beraman.`],[`She won't be late.`,`U kechikmaydi.`]],q:[[`I think it ___ rain tomorrow.`,[`will`,`is`,`does`],0],[`He ___ come. He is ill.`,[`will`,`won't`,`isn't`],1]]},42:{e:`should + fe'l: maslahat (You should rest). ought to ham shu ma'noda. Inkor: shouldn't.`,x:[[`You should drink more water.`,`Ko'proq suv ichishingiz kerak.`],[`He shouldn't be late.`,`U kechikmasligi kerak.`]],q:[[`You ___ sleep more.`,[`should`,`shoulds`,`should to`],0],[`She ___ eat so much sugar.`,[`should`,`shouldn't`,`don't`],1]]}};

K.r.push({L:'A1',t:'My Family',u:'Mening oilam',tx:`I have a small family. My father is a driver. My mother is a nurse. I have a sister. Her name is Dilnoza.`,q:[[`What is the father's job?`,[`Driver`,`Teacher`,`Doctor`],0],[`Who is Dilnoza?`,[`His sister`,`His mother`,`His aunt`],0]]},{L:'A2',t:'At the Bazaar',u:'Bozorda',tx:`Every Sunday I go to the bazaar with my mother. We buy fruit, bread and vegetables. Apples are cheap today, so we buy two kilos.`,q:[[`When do they go to the bazaar?`,[`Every Sunday`,`Every day`,`On Friday`],0],[`How many kilos of apples do they buy?`,[`Two`,`Five`,`Ten`],0]]},{L:'B2',t:'Remote Work',u:'Masofaviy ish',tx:`Remote work has become popular because it saves commuting time and gives people flexibility. However, some employees feel isolated and find it hard to separate work from home life. Companies therefore try to combine office days with home days.`,q:[[`Why is remote work popular?`,[`It saves time and offers flexibility`,`It pays more`,`It is easier`],0],[`What do companies try to do?`,[`Mix office and home days`,`Close offices`,`Stop remote work`],0]]});

const RX={4:{e:`Kishilik olmoshlari gapda ism o'rnida keladi.`,p:[[`Olmosh nima?`,`Takrorlamaslik uchun ism o'rniga ishlatiladigan so'z. «Sophie is a doctor. Sophie is kind.» deyish noqulay. To'g'risi: «Sophie is a doctor. She is kind.» O'zbekchada ham shunday: Sophie → u.`],[`7 ta olmosh`,`I — men<br>you — sen / siz / sizlar<br>he — u (erkak)<br>she — u (ayol)<br>it — u (narsa, hayvon)<br>we — biz<br>they — ular`],[`O'zbekcha bilan farqi`,`O'zbekchada «u» erkakka ham, ayolga ham, narsaga ham aytiladi. Inglizchada uch xil: he (erkak), she (ayol), it (narsa va hayvon). Shuning uchun avval kim haqida gapirayotganingizni aniqlang.`],[`Qoidalar`,`1) I doim bosh harf bilan yoziladi.<br>2) You birlik ham, ko'plik ham: sen, siz, sizlar.<br>3) Ikki va undan ko'p kishi = they: Ali and Anna → they.<br>4) Siz + boshqa kishi = we: you and I → we.<br>5) Hayvon va narsa = it: the shop → it.`]],x:[[`I am a student.`,`Men talabaman.`],[`You are my friend.`,`Sen mening do'stimsan.`],[`He is a doctor.`,`U (erkak) shifokor.`],[`She is a teacher.`,`U (ayol) o'qituvchi.`],[`It is a big shop.`,`U (do'kon) katta.`],[`They are at home.`,`Ular uyda.`]],q:[[`Anvar is my brother. ___ is tall.`,[`He`,`She`,`It`],0],[`My mother is a nurse. ___ is kind.`,[`He`,`She`,`They`],1],[`The phone is new. ___ is expensive.`,[`He`,`She`,`It`],2],[`Ali and Anna are friends. ___ are happy.`,[`We`,`They`,`He`],1],[`You and I are in class. ___ are students.`,[`We`,`They`,`You`],0],[`Qaysi olmosh doim bosh harf bilan yoziladi?`,[`I`,`you`,`it`],0],[`Mushuk uchun qaysi olmosh to'g'ri?`,[`he`,`it`,`they`],1]],t:[[`Sophie is a doctor. ___ is kind.`,`she`],[`My brothers are tall. ___ are strong.`,`they`],[`The dog is small. ___ is cute.`,`it`],[`Tom is my friend. ___ is funny.`,`he`],[`Anna and I are sisters. ___ are close.`,`we`]],wr:[`Do'stingiz haqida 2 ta gap yozing (He yoki She bilan).`,`Uyingizdagi biror narsa haqida 1 ta gap yozing (It bilan).`,`Siz va oilangiz haqida 1 ta gap yozing (We bilan).`]},5:{e:`am / is / are — «bo'lmoq» fe'li, inglizcha gapning asosi.`,p:[[`Nega kerak?`,`O'zbekchada «Men talabaman» deymiz: alohida fe'l yo'q, -man qo'shimchasi bor. Inglizchada gapda doim fe'l bo'lishi shart: I am a student. Bu yerda am o'zbekchadagi -man, -san, -dir qo'shimchalarining vazifasini bajaradi.`],[`Shakllari`,`I → am<br>he / she / it → is<br>you / we / they → are<br>Qisqartma: I'm, he's, she's, it's, you're, we're, they're`],[`3 xil gap`,`Darak: She is a doctor.<br>Inkor: not qo'shiladi → She is not (isn't) a doctor.<br>So'roq: fe'l gap boshiga chiqadi → Is she a doctor? Javob: Yes, she is. / No, she isn't.`],[`Qachon ishlatiladi?`,`1) Kim yoki nima ekanini aytganda: I am a driver.<br>2) Holat: He is tired.<br>3) Yosh: I am 25.<br>4) Joy: They are at home.<br>5) Millat: We are from Uzbekistan.`]],w:`Yosh haqida: I am 25 (I have 25 ✗). «Men 25 yoshdaman» — have emas, am ishlatiladi.`,x:[[`I am a student.`,`Men talabaman.`],[`She is tired.`,`U (ayol) charchagan.`],[`We are from Uzbekistan.`,`Biz O'zbekistondanmiz.`],[`Is he a doctor?`,`U shifokormi?`],[`They are not at home.`,`Ular uyda emas.`],[`I am 25 years old.`,`Men 25 yoshdaman.`]],q:[[`I ___ a student.`,[`am`,`is`,`are`],0],[`She ___ a nurse.`,[`am`,`is`,`are`],1],[`They ___ at work.`,[`is`,`am`,`are`],2],[`The shop ___ big.`,[`is`,`are`,`am`],0],[`We ___ friends.`,[`is`,`are`,`am`],1],[`___ you ready?`,[`Is`,`Are`,`Am`],1],[`Qaysi gap to'g'ri?`,[`I am 25 years old.`,`I have 25 years old.`,`I is 25 years old.`],0],[`Ali and Anna ___ students.`,[`is`,`are`,`am`],1]],t:[[`It ___ a cat. (am/is/are)`,`is`],[`You ___ my friend.`,`are`],[`I ___ happy today.`,`am`],[`___ she a teacher? (so'roq)`,`is`],[`The children ___ at school.`,`are`],[`We ___ not late.`,`are`]],wr:[`O'zingiz haqingizda 2 gap yozing: ismingiz va yoshingiz (I am...).`,`Do'stingiz haqida: kim va qayerdan (He/She is from...).`,`Bitta so'roq gap tuzing: Are you...? yoki Is she...?`]},1:{e:`a va an — «bitta» ma'nosidagi noaniq artikllar.`,p:[[`Artikl nima?`,`Inglizchada sanaladigan birlikdagi ot oldida odatda artikl turadi. O'zbekchada artikl yo'q, lekin ma'nosi «bitta» ga yaqin: a book — bitta kitob.`],[`a yoki an?`,`Harfga emas, TOVUSHGA qarang:<br>a — undosh tovush oldidan: a book, a dress, a shop<br>an — unli tovush oldidan: an apple, an egg, an orange`],[`Tuzoqlar`,`an hour — h o'qilmaydi, so'z unli bilan boshlanadi<br>a university — u «yu» deb o'qiladi (undosh tovush)<br>an umbrella — unli tovush`],[`Qachon QO'YILMAYDI?`,`Ko'plikda: books (a books ✗). Sanalmaydigan otlarda: water, money. Ismlarda: Ali. Kasb aytganda esa kerak: I am a teacher.`]],x:[[`a book`,`bitta kitob`],[`an apple`,`bitta olma`],[`an hour`,`bir soat`],[`a university`,`bitta universitet`],[`She is a teacher.`,`U o'qituvchi.`],[`I have an umbrella.`,`Menda soyabon bor.`]],q:[[`___ dress`,[`a`,`an`],0],[`___ orange`,[`a`,`an`],1],[`___ hour`,[`a`,`an`],1],[`___ university`,[`a`,`an`],0],[`He is ___ engineer.`,[`a`,`an`],1],[`Qaysi to'g'ri?`,[`a books`,`a book`,`an book`],1],[`She is ___ nurse.`,[`a`,`an`],0]],t:[[`I eat ___ apple. (a/an)`,`an`],[`She has ___ car.`,`a`],[`It is ___ egg.`,`an`],[`He is ___ honest man. (h o'qilmaydi)`,`an`],[`I need ___ pen.`,`a`]],wr:[`a bilan 2 ta gap yozing (masalan: I have a ...).`,`an bilan 2 ta gap yozing.`,`Kasbingiz haqida gap yozing: I am a/an ...`]},3:{e:`Ko'plik: birlikdagi otga qo'shimcha qo'shiladi, qoidalar bor.`,p:[[`Ko'plik nima?`,`Bitta narsa — birlik (book), ikkita va undan ko'p — ko'plik (books). O'zbekchada -lar qo'shamiz (kitob-lar), inglizchada asosan -s.`],[`4 ta qoida`,`1) Odatda -s: book → books.<br>2) -s, -x, -ch, -sh, -o bilan tugasa → -es: box → boxes, watch → watches, tomato → tomatoes.<br>3) Undosh + y → -ies: city → cities. (Unli + y: boy → boys.)<br>4) -f / -fe → -ves: knife → knives.`],[`Qoidasiz ko'plik`,`man → men<br>woman → women<br>child → children<br>foot → feet<br>tooth → teeth<br>person → people<br>Bularni yodlash kerak.`],[`Ko'plik va fe'l`,`Ko'plikdagi ot bilan are: The shoes are new. Birlikda is: The shoe is new. Sondan keyin ham ko'plik: two shirts, ten boxes.`]],x:[[`two books`,`ikkita kitob`],[`three boxes`,`uchta quti`],[`four cities`,`to'rtta shahar`],[`five children`,`beshta bola`],[`The shoes are new.`,`Poyabzallar yangi.`],[`I have two knives.`,`Menda ikkita pichoq bor.`]],q:[[`one watch, two ___`,[`watchs`,`watches`,`watchies`],1],[`one baby, two ___`,[`babys`,`babies`,`babyes`],1],[`one boy, two ___`,[`boys`,`boies`,`boyes`],0],[`one man, two ___`,[`mans`,`men`,`manes`],1],[`one knife, two ___`,[`knifes`,`knives`,`knifies`],1],[`one person, two ___`,[`persons`,`people`,`peoples`],1],[`The dresses ___ beautiful.`,[`is`,`are`,`am`],1]],t:[[`one box → two ___`,`boxes`],[`one city → two ___`,`cities`],[`one child → two ___`,`children`],[`one tomato → two ___`,`tomatoes`],[`one foot → two ___`,`feet`]],wr:[`Do'koningizdagi 3 ta narsani ko'plikda yozing (two shirts...).`,`Qoidasiz ko'plikdagi 2 ta so'z bilan gap yozing.`,`There are ... bilan 1 ta gap yozing.`]}};

const RY={91:{e:`Qiyosiy daraja: ikki narsani solishtirish (taller than, more expensive than).`,p:[[`Nima uchun kerak?`,`Ikki narsa yoki odamni solishtirganda ishlatiladi. O'zbekchada -roq qo'shimchasi: katta → kattaroq. Inglizchada ikki yo'l bor va har doim than («...dan») ishlatiladi: Ali is taller than Omar.`],[`1-yo'l: qisqa sifat + -er`,`Bir bo'g'inli sifatlar: tall → taller, fast → faster, old → older.<br>-e bilan tugasa faqat -r: nice → nicer.<br>Undosh+y → -ier: easy → easier, happy → happier.<br>Qisqa undosh+unli+undosh → undosh ikkilanadi: big → bigger, hot → hotter.`],[`2-yo'l: more + uzun sifat`,`Ikki va undan ko'p bo'g'inli sifatlar: expensive → more expensive, interesting → more interesting, beautiful → more beautiful. Teskarisi: less expensive (kamroq qimmat).`],[`Qoidasizlar va tuzoqlar`,`good → better, bad → worse, far → farther.<br>Xato: more taller ✗ → taller ✓. Xato: than o'rniga that ✗.<br>Tenglik: as ... as (as tall as — ...dek baland).`]],x:[[`My bag is bigger than your bag.`,`Mening sumkam seningnikidan kattaroq.`],[`This dress is more expensive than that one.`,`Bu ko'ylak anavisidan qimmatroq.`],[`Today is hotter than yesterday.`,`Bugun kechagidan issiqroq.`],[`English is easier than I thought.`,`Ingliz tili o'ylaganimdan osonroq.`],[`Her phone is better than mine.`,`Uning telefoni meniknidan yaxshiroq.`],[`Tashkent is bigger than Samarkand.`,`Toshkent Samarqanddan kattaroq.`]],q:[[`A car is ___ than a bike.`,[`fast`,`faster`,`more fast`],1],[`This film is ___ than that one.`,[`more interesting`,`interestinger`,`most interesting`],0],[`My brother is ___ than me.`,[`tall`,`taller`,`more tall`],1],[`Today is ___ than yesterday. (hot)`,[`hoter`,`hotter`,`more hot`],1],[`This exam was ___ than the last one. (easy)`,[`easyer`,`more easy`,`easier`],2],[`Her English is ___ than mine. (good)`,[`gooder`,`better`,`more good`],1],[`Qaysi gap to'g'ri?`,[`She is more taller than me.`,`She is taller than me.`,`She is taller that me.`],1]],t:[[`small → ___ (qiyosiy)`,`smaller`],[`beautiful → ___ beautiful`,`more`],[`bad → ___`,`worse`],[`happy → ___`,`happier`],[`Silk is ___ expensive than cotton.`,`more`]],wr:[`Ikki do'stingizni solishtiring (taller, older... than).`,`Ikki shaharni -er than bilan solishtiring.`,`more ... than bilan 1 ta gap yozing.`]},93:{e:`Orttirma daraja: guruh ichida eng ... (the tallest, the most expensive).`,p:[[`Nima uchun kerak?`,`Ikkitadan ko'p narsa orasida «eng» ma'nosini berish uchun. Inglizcha sifat oldida doim the turadi: the biggest.`],[`Qisqa sifatlar: the + -est`,`tall → the tallest, old → the oldest, fast → the fastest.<br>-e bilan tugasa: nice → the nicest.<br>Undosh+y: easy → the easiest.<br>Qisqa undosh+unli+undosh: big → the biggest, hot → the hottest.`],[`Uzun sifatlar: the most`,`expensive → the most expensive, interesting → the most interesting. Teskarisi: the least expensive (eng arzon).`],[`Qoidasizlar va ishlatilishi`,`good → the best, bad → the worst, far → the farthest.<br>Odatda in yoki of bilan: the tallest in the class, the best of all.<br>Eslatma: the ni tushirib qoldirmang!`]],x:[[`He is the tallest boy in the class.`,`U sinfdagi eng baland bola.`],[`This is the most expensive shop in town.`,`Bu shahardagi eng qimmat do'kon.`],[`It is the best film of the year.`,`Bu yilning eng yaxshi filmi.`],[`Today is the hottest day of the summer.`,`Bugun yozning eng issiq kuni.`],[`She is the youngest in the family.`,`U oilaning eng kichigi.`],[`That was the worst day of my life.`,`Bu hayotimdagi eng yomon kun edi.`]],q:[[`She is ___ girl in the class. (tall)`,[`the taller`,`the tallest`,`tallest`],1],[`This is ___ book I know. (interesting)`,[`the most interesting`,`the interestingest`,`most interesting`],0],[`He is ___ player in the team. (good)`,[`the goodest`,`the best`,`the better`],1],[`It is ___ day of the year. (hot)`,[`the hottest`,`the hotest`,`the most hot`],0],[`This is ___ shop in town. (cheap)`,[`the cheapest`,`the most cheap`,`cheapest`],0],[`He is the funniest ___ my friends.`,[`in`,`of`,`at`],1],[`Qaysi to'g'ri?`,[`She is the most tall.`,`She is the tallest.`,`She is tallest.`],1]],t:[[`big → the ___`,`biggest`],[`easy → the ___`,`easiest`],[`bad → the ___`,`worst`],[`expensive → the ___ expensive`,`most`],[`She is ___ youngest in our family.`,`the`]],wr:[`Oilangizdagi eng baland va eng kichik odam haqida gap yozing.`,`Shahringizdagi eng go'zal joy haqida 1 ta gap (the most...).`,`Sizningcha eng yaxshi film haqida the best bilan gap yozing.`]},101:{e:`Birinchi shart gap: kelajakdagi real imkoniyat (If it rains, I will stay).`,p:[[`Nima uchun kerak?`,`Kelajakda bo'lishi mumkin bo'lgan ish va uning natijasini aytish uchun. O'zbekchada «agar yomg'ir yog'sa, uyda qolaman». Inglizchada ikki qism bor: if qismi va natija qismi.`],[`Formula`,`If + Present Simple, will + fe'l<br>If it rains, I will stay at home.<br>Qismlarni almashtirsa ham bo'ladi: I will stay at home if it rains. (Bunda vergul kerak emas.)`],[`Eng ko'p xato`,`If qismida will ishlatilmaydi!<br>If it will rain ✗ → If it rains ✓.<br>Natija qismida will yoki won't: She won't come if she is busy.`],[`Qachon ishlatiladi?`,`Va'da: If you help me, I will help you.<br>Ogohlantirish: If you don't hurry, you will be late.<br>Reja: If I get the job, I will buy a car.<br>Unless = if ... not: Unless you hurry, you'll be late.`]],x:[[`If it rains, I will stay at home.`,`Yomg'ir yog'sa, uyda qolaman.`],[`If you study, you will pass the exam.`,`O'qisangiz, imtihondan o'tasiz.`],[`She will be late if she doesn't hurry.`,`Shoshilmasa, u kechikadi.`],[`If I get the job, I will buy a car.`,`Ishga kirsam, mashina sotib olaman.`],[`We won't go out if it snows.`,`Qor yog'sa, tashqariga chiqmaymiz.`],[`If you help me, I will help you.`,`Menga yordam bersangiz, men ham yordam beraman.`]],q:[[`If it rains, I ___ at home.`,[`stay`,`will stay`,`stayed`],1],[`If she ___ hard, she will pass.`,[`will study`,`studies`,`studied`],1],[`We ___ go out if it snows.`,[`won't`,`don't`,`aren't`],0],[` const RT={27:{e:`Past Continuous: o'tmishda ma'lum payt davom etayotgan ish.`,p:[[`Nima uchun kerak?`,`O'zbekchada «ishlayotgan edim» — o'tmishda ma'lum paytdagi jarayon. Inglizchada: I was working at five. Jarayon muhim, natija emas.`],[`Formula`,`was / were + fe'l-ing<br>I / he / she / it was working; you / we / they were working.<br>Inkor: wasn't / weren't working. So'roq: Were you working?`],[`Qachon?`,`1) Aniq payt: at 5 o'clock yesterday.<br>2) Ikki ish bir vaqtda: I was cooking while she was reading.<br>3) Uzilgan ish: I was sleeping when he called.<br>Tuzoq: when + Past Simple (qisqa ish), while + Past Continuous (uzoq ish).`]],x:[[`I was sleeping at ten.`,`Soat o'nda uxlayotgan edim.`],[`They were watching TV.`,`Ular televizor ko'rayotgan edi.`],[`She was cooking when he called.`,`U qo'ng'iroq qilganda ovqat pishirayotgan edi.`],[`We weren't working then.`,`U paytda biz ishlamayotgan edik.`]],q:[[`She ___ at six.`,[`was reading`,`were reading`,`reads`],0],[`We ___ when he called.`,[`was eating`,`were eating`,`ate`],1],[`I was cooking ___ she was reading.`,[`while`,`when`,`and`],0],[`___ you sleeping at ten?`,[`Was`,`Were`,`Did`],1],[`He was sleeping ___ the phone rang.`,[`while`,`when`,`and`],1]],t:[[`I ___ (work) at five yesterday.`,`was working`],[`They ___ (not sleep) then.`,`weren't sleeping|were not sleeping`],[`___ she (cook) at six? (Was/Were)`,`was`]],wr:[`Kecha soat 8 da nima qilayotganingizni yozing.`,`When bilan uzilgan ish haqida 1 ta gap yozing.`]},36:{e:`be going to: rejalangan kelajak yoki belgilar bor natija.`,p:[[`Nima uchun kerak?`,`O'zbekchada «qilmoqchiman» — reja. Inglizchada: I am going to buy a car. Qaror oldindan qabul qilingan.`],[`Formula`,`am / is / are + going to + asl fe'l<br>Inkor: am / is / are not going to. So'roq: Are you going to...?`],[`Qachon?`,`1) Reja: I am going to open a shop.<br>2) Belgilar bor: Look at the clouds! It is going to rain.<br>Tuzoq: going to dan keyin fe'l asl shaklda. Will bilan farqi: will — shu zahoti K.g.push({L:'Zamonlar',t:'118. Past Perfect',u:'',e:`Past Perfect: o'tmishdagi boshqa ishdan OLDIN tugagan ish.`,p:[[`Nima uchun kerak?`,`O'zbekchada «ketgan edi», «yeb bo'lgan edi». O'tmishda ikki ish bo'lsa, oldin bo'lganini Past Perfect, keyin bo'lganini Past Simple bilan aytamiz: When I arrived, she had left.`],[`Formula`,`had + V3 (barcha shaxslarda)<br>She had left. Inkor: hadn't left. So'roq: Had she left?<br>Qisqartma: I'd, she'd.`],[`Qachon?`,`before, after, by the time, already, just bilan.<br>I had already eaten when he came.<br>Past Perfect «oldinroq» bo'lganini ko'rsatadi, Past Simple esa keyingisini.`]],x:[[`When I arrived, she had left.`,`Men kelganimda, u ketib bo'lgan edi.`],[`I had already eaten when he came.`,`U kelganda men ovqatlanib bo'lgan edim.`],[`She hadn't finished before the bell.`,`Qo'ng'iroqdan oldin u tugatmagan edi.`],[`Had you seen it before?`,`Buni oldin ko'rganmiding?`]],q:[[`When I arrived, she ___ left.`,[`has`,`had`,`was`],1],[`I ___ already eaten when he came.`,[`had`,`have`,`was`],0],[`She ___ finished before the bell.`,[`hadn't`,`didn't`,`wasn't`],0],[`___ you seen it before?`,[`Had`,`Have`,`Did`],0],[`Past Perfect formulasi:`,[`had + V3`,`have + V3`,`was + V-ing`],0]],tp:[[`When I came, she ___ (leave).`,`had left`],[`I ___ (eat) already when he called.`,`had eaten`],[`She ___ (not finish) before the bell.`,`hadn't finished|had not finished`]],wr:[`Kecha uyga kelganingizda nima bo'lib bo'lganini yozing (When I came home, ... had ...).`,`already bilan 1 ta gap yozing.`]},{L:'Zamonlar',t:'119. Present Perfect Continuous',u:'',e:`Present Perfect Continuous: o'tmishdan hozirgacha davom etayotgan jarayon.`,p:[[`Nima uchun kerak?`,`«Ikki soatdan beri o'qiyapman» — jarayon va davomiylik. Inglizchada: I have been studying for two hours. Jarayon muhim.`],[`Formula`,`have / has + been + fe'l-ing<br>She has been working. Inkor: hasn't been working. So'roq: Have you been working?`],[`Qachon?`,`for (davomiylik), since (boshlanish), all day, lately, recently.<br>Farqi: I have painted the room (tugadi) / I have been painting the room (jarayon).<br>Tuzoq: holat fe'llari (know, like) bilan Continuous ishlatilmaydi.`]],x:[[`I have been studying for two hours.`,`Ikki soatdan beri o'qiyapman.`],[`She has been working since morning.`,`U ertalabdan beri ishlayapti.`],[`It has been raining all day.`,`Kun bo'yi yomg'ir yog'ayapti.`],[`How long have you been waiting?`,`Qancha vaqtdan beri kutyapsiz?`]],q:[[`I ___ for two hours.`,[`have been studying`,`am studying`,`studied`],0],[`She ___ since morning.`,[`has been working`,`have been working`,`works`],0],[`It has been raining ___ morning.`,[`for`,`since`,`ago`],1],[`How long ___ you been waiting?`,[`have`,`has`,`did`],0],[`Formula:`,[`have/has + been + V-ing`,`had + V3`,`will + V`],0]],tp:[[`I ___ (study) for two hours.`,`have been studying`],[`She ___ (work) since morning.`,`has been working`],[`It has been raining ___ two days. (for/since)`,`for`]],wr:[`Qancha vaqtdan beri ingliz tili o'rganayotganingizni yozing.`,`How long have you been ...? bilan savol tuzing.`]},{L:'Zamonlar',t:'120. Past Perfect Continuous',u:'',e:`Past Perfect Continuous: o'tmishdagi payt oldidan davom etgan jarayon.`,p:[[`Nima uchun kerak?`,`O'tmishdagi paytdan oldin qancha davom etgan jarayon: When she came, I had been waiting for an hour.`],[`Formula`,`had + been + fe'l-ing<br>Inkor: hadn't been working. So'roq: Had you been working?`],[`Qachon?`,`for, since, all day bilan; o'tmishdagi natijaning sababi: She was tired because she had been running.`]],x:[[`I had been waiting for an hour when she came.`,`U kelganda bir soatdan beri kutayotgan edim.`],[`She was tired because she had been running.`,`U yugurgani uchun charchagan edi.`],[`They had been working since six.`,`Ular oltidan beri ishlayotgan edi.`]],q:[[`I ___ for an hour when she came.`,[`had been waiting`,`have been waiting`,`was wait`],0],[`She was tired because she ___.`,[`had been running`,`has run`,`runs`],0],[`Formula:`,[ function story(n){const s=ST[n];$('#v').innerHTML=`<h1>The Little Tailor</h1><div class=c><div class=sce>${s[0]}</div><h2>${s[1]}</h2><p class=h>${s[2]}</p><button class=g data-s="${s[1]}">🔊</button></div><div class=row>${n?`<button class="b alt" onclick="story(${n-1})">←</button>`:''}${n<ST.length-1?`<button class=b onclick="story(${n+1})">Keyingisi →</button>`:`<button class=b onclick="if(!st.d.st){st.d.st=1;gain(10)}go('m')">Tugatdim ✓</button>`}</div>`;say(s[1])}
const PO=K.g.flatMap(x=>x.x||[]).concat(SH).filter(e=>e[0].split(' ').length>2);
function bt(){B={m:0,b:0,r:0};$('#v').innerHTML=`<div class="c gr rd ctr"><div style="width:100%"><div class=big2>⚔️</div><h2>Bellashuv</h2><p>Bot bilan 6 raund: so'z topish va gaplarni tartibga solish. Tezroq va aniqroq bo'ling!</p><button class="b alt" style="color:#fff;border-color:#fff" onclick="rd()">Boshlash</button></div></div>`}
function rd(){if(B.r>=6){const w=B.m>B.b,d=B.m===B.b;gain(w?15:d?5:2);$('#v').innerHTML=`<div class="c ctr"><div class=big2>${w?'🏆':d?'🤝':'💪'}</div><h2>Siz ${B.m} : ${B.b} Bot</h2><p>${w?"G'alaba! +15 🪙":d?'Durang! +5 🪙':"Yutqazdingiz, yana urinib ko'ring +2 🪙"}</p><button class=b onclick="bt()">Qayta o'ynash</button></div>`;return}
B.r++;const wd=B.r%2,tm0=wd?12:25;let t=tm0,over=false;clearInterval(B.iv);
const hd=`<div class=sc><span>Siz ${B.m}</span><span>Raund ${B.r}/6</span><span>Bot ${B.b}</span></div><div class=pr><i id=tb style="width:100%"></i></div>`;
const end=ok=>{over=true;clearInterval(B.iv);const bo=Math.random()<(wd?.65:.5);if(ok)B.m++;if(bo)B.b++;$('#v').insertAdjacentHTML('beforeend',`<div class="c ctr">${ok?"✅ To'g'ri":"❌ Noto'g'ri"} · 🤖 ${bo?'✅':'❌'}</div>`);setTimeout(rd,1300)};
B.iv=setInterval(()=>{t--;const e=$('#tb');if(e)e.style.width=t/tm0*100+'%';if(t<=0&&!over)end(false)},1000);
if(wd){const x=sh(ALL)[0],o=opts(x);$('#v').innerHTML=hd+`<div class=c><div class=em>${x[2]}</div><h2>${x[0]}</h2>${o.map((q,k)=>`<button class=o data-k=${k}>${q}</button>`).join('')}</div>`;say(x[0]);
document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{if(over)return;const k=+b.dataset.k;b.classList.add(o[k]===x[1]?'y':'n');end(o[k]===x[1])})}
else{const e=sh(PO)[0],pool=sh(e[0].split(' ').map((x,i)=>[x,i]));let ans=[];$('#v').innerHTML=hd+`<div class=c><p>${e[1]}</p><div id=ans class=chips></div><div id=pl class=chips></div><button class=b id=ck>Tekshirish</button></div>`;
const draw=()=>{[['ans',ans],['pl',pool.filter(p=>!ans.includes(p))]].forEach(([id,arr])=>{const el=$('#'+id);el.innerHTML='';arr.forEach(p=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{if(over)return;if(id==='ans')ans.splice(ans.indexOf(p),1);else ans.push(p);draw()};el.appendChild(b)})})};draw();
$('#ck').onclick=()=>{if(over||!ans.length)return;end(ans.map(p=>p[0]).join(' ')===e[0])}}}
go('h');
</script></body></html>
